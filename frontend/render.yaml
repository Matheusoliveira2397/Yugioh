services:
  - type: web
    name: yugioh-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false  # Configure com a URL do backend
      - key: VITE_WS_URL
        sync: false  # Configure com a URL do WebSocket (wss://)

