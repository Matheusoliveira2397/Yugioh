name: Create Fly volume (run once)

on:
  workflow_dispatch:

jobs:
  create-volume:
    name: Criar volume yugioh_cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Criar volume 1 no app yugioh (região gru)
        run: |
          flyctl volumes create yugioh_cards --app yugioh --region gru --size 1 --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Criar volume 2 no app yugioh (região gru)
        run: |
          flyctl volumes create yugioh_cards --app yugioh --region gru --size 1 --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
