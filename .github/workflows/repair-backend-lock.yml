name: Repair backend npm lockfile
on:
  push:
    branches: [fix/typescript-release-gates-2026]
    paths:
      - '.github/workflows/repair-backend-lock.yml'
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typescript-release-gates-2026
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate package lock based on compatible declared dependencies
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        working-directory: backend
        run: npm ci
      - name: Commit dependency lock only
        run: |
          if ! git diff --quiet -- backend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/package-lock.json
            git commit -m "fix(deps): regenerate compatible backend lockfile"
            git push origin HEAD:fix/typescript-release-gates-2026
          fi
