events {
  worker_connections 2048;  # Aumentado para suportar mais conexões simultâneas
  use epoll;  # Melhor performance no Linux
}

http {
  # Timeouts globais
  keepalive_timeout 65;
  keepalive_requests 100;
  
  # Buffer sizes
  client_body_buffer_size 128k;
  client_max_body_size 10m;
  
  # Timeouts
  client_body_timeout 60s;
  client_header_timeout 60s;
  send_timeout 60s;

  # Upstream para requisições HTTP normais
  upstream backend_http {
    server backend:3000;
    keepalive 32;  # Manter conexões abertas para reutilização
  }

  # Upstream para WebSocket (mesmo servidor, mas com configurações diferentes)
  upstream backend_ws {
    server backend:3000;
    keepalive 32;
  }

  upstream frontend {
    server frontend:5173;
    keepalive 32;
  }

  server {
    listen 80;
    server_name localhost;

    # Frontend
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache_bypass $http_upgrade;
      
      # Timeouts para frontend
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # Backend API - Requisições HTTP normais
    location /api {
      rewrite ^/api/(.*) /$1 break;
      proxy_pass http://backend_http;
      proxy_http_version 1.1;
      
      # Headers importantes
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # Keep-alive para reutilizar conexões
      proxy_set_header Connection "";
      
      # Timeouts adequados para HTTP
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      
      # Buffering (habilitado para HTTP)
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
    }

    # WebSocket - Configuração específica
    location /socket.io {
      proxy_pass http://backend_ws;
      proxy_http_version 1.1;
      
      # Headers críticos para WebSocket
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # DESABILITAR buffering para WebSocket (crítico!)
      proxy_buffering off;
      proxy_cache off;
      
      # Timeouts longos para WebSocket (conexão persistente)
      proxy_connect_timeout 7d;
      proxy_send_timeout 7d;
      proxy_read_timeout 7d;
    }
  }
}
