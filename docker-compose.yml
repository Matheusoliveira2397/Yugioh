# Caminho do projeto no host (evita C: quando o projeto está em D:)
# Crie .env na raiz com: PROJECT_PATH=D:/Yugioh
#
# Perfis:
#   (padrão / lite)  docker compose up -d
#       → postgres + mongodb + redis + backend
#       → rode o frontend no host: cd frontend && npm run dev
#   docker-ui        docker compose --profile docker-ui up -d
#       → + frontend Vite no container + nginx
#   tools            docker compose --profile tools up -d
#       → + Adminer (http://localhost:8080)
#
# Windows (recomendado): scripts/dev-lite.ps1
services:
  # PostgreSQL - Banco de dados principal
  postgres:
    image: postgres:16-alpine
    container_name: yugioh-postgres
    environment:
      POSTGRES_USER: yugioh_user
      POSTGRES_PASSWORD: yugioh_password_2024
      POSTGRES_DB: yugioh_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yugioh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yugioh_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - Para chat e logs
  mongodb:
    image: mongo:7.0
    container_name: yugioh-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: yugioh_mongo
      MONGO_INITDB_ROOT_PASSWORD: yugioh_mongo_password
      MONGO_INITDB_DATABASE: yugioh_chat
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - yugioh-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache e sessões
  redis:
    image: redis:7-alpine
    container_name: yugioh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - yugioh-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  # Adminer - só com: docker compose --profile tools up -d
  adminer:
    profiles: ["tools"]
    image: adminer:latest
    container_name: yugioh-adminer
    ports:
      - "8080:8080"
    networks:
      - yugioh-network
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  # Backend API (dev: nest start --watch)
  backend:
    build:
      context: ${PROJECT_PATH:-.}/backend
      dockerfile: Dockerfile.dev
    container_name: yugioh-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://yugioh_user:yugioh_password_2024@postgres:5432/yugioh_db}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_TRANSACTION_POOLER: ${SUPABASE_TRANSACTION_POOLER:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
      MONGODB_URI: mongodb://yugioh_mongo:yugioh_mongo_password@mongodb:27017/yugioh_chat?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: yugioh_super_secret_key_2024_change_in_production
      CORS_ORIGIN: http://localhost:5173
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}
      BOT_AI_ENABLED: ${BOT_AI_ENABLED:-true}
      BOT_AI_API_KEY: ${BOT_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BOT_AI_BASE_URL: ${BOT_AI_BASE_URL:-https://api.openai.com/v1}
      BOT_AI_MODEL: ${BOT_AI_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yugioh-network
    volumes:
      - uploads_data:/app/uploads
      - ${PROJECT_PATH:-.}/backend/src:/app/src
      - ${PROJECT_PATH:-.}/frontend/public/images/cards:/app/frontend-cards
    command: npx nest start --watch

  # Frontend no Docker — só com profile docker-ui (pesado no Windows)
  frontend:
    profiles: ["docker-ui"]
    build:
      context: ${PROJECT_PATH:-.}/frontend
      dockerfile: Dockerfile.dev
    container_name: yugioh-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: http://localhost:3000
      # Volume montado no Windows: polling necessário dentro do container
      VITE_USE_POLLING: "1"
    depends_on:
      - backend
    networks:
      - yugioh-network
    volumes:
      - ${PROJECT_PATH:-.}/frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # Nginx — só com profile docker-ui
  nginx:
    profiles: ["docker-ui"]
    image: nginx:alpine
    container_name: yugioh-nginx
    ports:
      - "80:80"
    volumes:
      - ${PROJECT_PATH:-.}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - yugioh-network

networks:
  yugioh-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  uploads_data:
