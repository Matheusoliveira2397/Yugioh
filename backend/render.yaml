services:
  - type: web
    name: yugioh-backend
    env: node
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/docs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false  # Configure manualmente com a URL do PostgreSQL
      - key: MONGODB_URI
        sync: false  # Configure manualmente (opcional)
      - key: REDIS_URL
        sync: false  # Configure manualmente (opcional)
      - key: JWT_SECRET
        generateValue: true  # Gera automaticamente
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false  # Configure com a URL do frontend
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: HTTP_TIMEOUT
        value: 30000
      - key: MAX_CONNECTIONS
        value: 2000
      - key: LOG_LEVEL
        value: info


