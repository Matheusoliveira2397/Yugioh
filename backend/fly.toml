# fly.toml app configuration file generated for yugioh on 2026-01-02T06:20:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'yugioh'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# Volume para persistir imagens das cartas (/images/cards)
[mounts]
  source = "yugioh_cards"
  destination = "/app/frontend-cards"
