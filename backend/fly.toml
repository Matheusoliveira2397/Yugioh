# fly.toml app configuration file generated for yugioh on 2026-01-02T06:20:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'yugioh'
primary_region = 'gru'

# Imagem explícita (evita confusão com outros Dockerfiles no repo)
[build]
  dockerfile = "Dockerfile.fly"

# Duelos em WebSocket: sem scale-to-zero (evita cold start e queda de conexões).
# Para reduzir custo em ambiente de teste, volte min_machines_running = 0 e auto_stop_machines = 'stop'.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Proxy Fly: tempo maior para conexões ociosas (complementa ping do Socket.IO).
  [http_service.http_options]
    idle_timeout = 3600

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# Volume para persistir imagens das cartas (/images/cards)
[mounts]
  source = "yugioh_cards"
  destination = "/app/frontend-cards"
